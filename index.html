<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>改札 完全版</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
  overflow: hidden;

  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
* {
  -webkit-tap-highlight-color: transparent;
}

#screen {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 上バー */
#header {
  height: 80px;
  background: #00a65a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: bold;
}

/* メイン */
#main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: black;
}

#text {
  font-size: 70px;
  font-weight: bold;
  text-align: center;
}

/* 残高 */
#balance {
  font-size: 28px;
  margin-top: 20px;
  display: none;
}

/* タッチエリア */
#touchArea {
  height: 200px;
  background: #222;
  border-top: 4px solid #00a65a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  opacity: 0.8;
}

/* チャージ */
#chargeBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  padding: 15px 25px;
  font-size: 18px;
}
</style>
</head>
<body>

<div id="screen">
  <div id="header">IC</div>

  <div id="main">
    <div id="text">タッチしてください</div>
    <div id="balance"></div>
  </div>

  <div id="touchArea">ここにタッチ</div>
</div>

<button id="chargeBtn">チャージ</button>

<script>
// ===== Cookie =====
function setCookie(n,v){document.cookie=n+"="+v+";path=/";}
function getCookie(n){let m=document.cookie.match('(^|;) ?'+n+'=([^;]*)(;|$)');return m?m[2]:null;}

let balance = parseInt(getCookie("balance")) || 3000;
let hasEntry = getCookie("hasEntry") === "true";

// ===== UI =====
const text = document.getElementById("text");
const bal = document.getElementById("balance");
const screen = document.getElementById("screen");

// ===== 音 =====
const ctx = new (window.AudioContext || window.webkitAudioContext)();

function okSound(){
  let o1=ctx.createOscillator(), o2=ctx.createOscillator();
  o1.frequency.value=1200;
  o2.frequency.value=1600;
  o1.connect(ctx.destination);
  o2.connect(ctx.destination);
  o1.start();
  setTimeout(()=>o1.stop(),80);
  setTimeout(()=>{o2.start();setTimeout(()=>o2.stop(),80);},100);
}

function ngSound(){
  let o1=ctx.createOscillator(), o2=ctx.createOscillator();
  o1.frequency.value=400;
  o2.frequency.value=300;
  o1.connect(ctx.destination);
  o2.connect(ctx.destination);
  o1.start();
  setTimeout(()=>o1.stop(),120);
  setTimeout(()=>{o2.start();setTimeout(()=>o2.stop(),120);},150);
}

// ===== 状態 =====
let busy = false;
let lastIsTop = false;

// ===== タッチ処理 =====
document.body.addEventListener("click",(e)=>{
  if(e.target.id==="chargeBtn") return;
  if(ctx.state==="suspended") ctx.resume();
  if(busy) return;
  busy = true;

  const isTop = e.clientY < window.innerHeight/2;
  lastIsTop = isTop;

  screen.style.transform = isTop ? "rotate(180deg)" : "rotate(0deg)";

  const fail = Math.random() < 0.1;

  bal.style.display="block";
  bal.innerText="残高: ¥"+balance;

  if(fail){
    error();
  } else {
    if(!isTop){
      // 入場
      if(hasEntry || balance < 160){
        error();
      } else {
        balance -= 160;
        hasEntry = true;
        success("入場");
      }
    } else {
      // 出場
      if(!hasEntry){
        error();
      } else {
        hasEntry = false;
        success("出場");
      }
    }
  }

  setCookie("balance",balance);
  setCookie("hasEntry",hasEntry);

  setTimeout(reset,1500);
});

// ===== 成功 =====
function success(msg){
  text.innerText = msg;
  document.body.style.background = "#040";
  flash("#0f0");
  okSound();
}

// ===== エラー =====
function error(){
  text.innerText = "タッチしなおしてください";
  document.body.style.background = "#400";
  flash("#f00");
  ngSound();
}

// ===== フラッシュ =====
function flash(color){
  document.body.style.transition="background 0.1s";
  setTimeout(()=>{document.body.style.background=color;},50);
}

// ===== リセット（向き反転） =====
function reset(){
  text.innerText="タッチしてください";
  document.body.style.background="#111";
  bal.style.display="none";

  // ★最後のタッチの逆向きにする
  screen.style.transform =
    lastIsTop ? "rotate(0deg)" : "rotate(180deg)";

  busy=false;
}

// ===== チャージ =====
document.getElementById("chargeBtn").onclick=()=>{
  balance+=1000;
  setCookie("balance",balance);
  alert("1000円チャージ！");
};

// ===== 長押し管理者 =====
let t;
const btn=document.getElementById("chargeBtn");

btn.addEventListener("touchstart",()=>{
  t=setTimeout(()=>{
    let p=prompt("パスワード");
    if(p==="2059"){
      let n=prompt("残高");
      if(n!==null){
        balance=parseInt(n)||0;
        setCookie("balance",balance);
        alert("変更OK");
      }
    } else alert("NG");
  },1500);
});

btn.addEventListener("touchend",()=>clearTimeout(t));

</script>
</body>
</html>
