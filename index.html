<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>電車UI 完全版</title>

<style>
body {
  background:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  font-family:sans-serif;
}

.display {
  position:relative;
  width:90vw;
  max-width:1000px;
  aspect-ratio:16/9;
  background:white;
  border:3px solid #ff6600;
  display:flex;
  flex-direction:column;
}

/* 左上ステータス */
.status {
  position:absolute;
  top:10px;
  left:15px;
  font-size:18px;
  font-weight:bold;
}

/* 上 */
.top {
  flex:2;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  font-weight:bold;
}

/* 区間 */
.section {
  text-align:center;
}

/* 路線 */
.line {
  flex:1;
  display:flex;
  justify-content:space-around;
  align-items:flex-end;
}

/* 駅 */
.station {
  display:flex;
  flex-direction:column;
  align-items:center;
}

.circle {
  width:18px;
  height:18px;
  border-radius:50%;
  background:#ccc;
}

.current .circle {
  background:red;
  animation:blink 1s infinite;
}

@keyframes blink {50%{opacity:0;}}

.name {
  writing-mode: vertical-rl;
  font-size:24px;
}

.time { font-size:12px; }

.passed { opacity:0.2; }

/* 下 */
.bottom {
  text-align:center;
}

/* お知らせ */
.notice {
  background:black;
  color:white;
  font-size:28px;
  overflow:hidden;
  white-space:nowrap;
}
.notice span {
  display:inline-block;
  padding-left:100%;
  animation:scroll 12s linear infinite;
}
@keyframes scroll {
  100% { transform:translateX(-100%); }
}

/* 設定 */
.settings-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff6600;
  color:white;
  padding:10px;
  cursor:pointer;
}

.panel {
  position:fixed;
  bottom:70px;
  right:20px;
  background:white;
  border:2px solid #333;
  padding:10px;
  display:none;
  max-height:70vh;
  overflow:auto;
}
</style>
</head>

<body>

<div class="display">
  <div class="status" id="statusText">現在</div>

  <div class="top" id="topText">待機中</div>
  <div class="section" id="sectionText"></div>

  <div class="line" id="line"></div>

  <div class="bottom" id="bottomText"></div>

  <div class="notice"><span id="noticeText">お知らせなし</span></div>
</div>

<div class="settings-btn" onclick="togglePanel()">⚙️</div>

<div class="panel" id="panel">
  <button onclick="startTrain()">▶️</button>
  <button onclick="stopTrain()">⏹</button>
  <button onclick="toggleLoop()">🔁 環状線切替</button>

  <div id="loopStateText"></div>

  <hr>

  <input id="name" placeholder="駅名"><br>
  <input id="stop" type="number" placeholder="停車秒"><br>
  <input id="travel" type="number" placeholder="移動秒"><br>
  <button onclick="addStation()">追加</button>

  <hr>

  <input id="noticeInput" placeholder="お知らせ">
  <button onclick="setNotice()">設定</button>

  <hr>

  <div id="stationList"></div>
</div>

<script>
let stations = [
  {name:"掛川",stop:5,travel:5},
  {name:"浜松",stop:5,travel:5}
];

let index=0;
let running=false;
let loop=true;
let interval;

// ===== UI =====
function togglePanel(){
  panel.style.display =
    panel.style.display==="block"?"none":"block";
}

// ===== 描画 =====
function render(){
  line.innerHTML="";
  stationList.innerHTML="";

  stations.forEach((s,i)=>{
    // 路線
    const div=document.createElement("div");
    div.className="station";
    div.innerHTML=`
      <div class="circle"></div>
      <div class="name">${s.name}</div>
      <div class="time" id="t${i}"></div>
    `;
    line.appendChild(div);

    // 設定リスト
    const item=document.createElement("div");
    item.textContent=s.name;

    const del=document.createElement("button");
    del.textContent="削除";
    del.onclick=()=>deleteStation(i);

    item.appendChild(del);
    stationList.appendChild(item);
  });

  loopStateText.textContent =
    "環状線状態: " + (loop ? "ON" : "OFF");
}

// ===== 駅操作 =====
function addStation(){
  const name=document.getElementById("name").value.trim();
  const stop=Number(document.getElementById("stop").value);
  const travel=Number(document.getElementById("travel").value);

  if(!name || stop<=0 || travel<0){
    alert("入力ミス");
    return;
  }

  stations.push({name,stop,travel});

  document.getElementById("name").value="";
  document.getElementById("stop").value="";
  document.getElementById("travel").value="";

  render();
}

function deleteStation(i){
  stations.splice(i,1);
  if(index>=i) index--;
  if(index<0) index=0;
  render();
}

// ===== 表示更新 =====
function updateStations(){
  document.querySelectorAll(".station").forEach((el,i)=>{
    el.classList.remove("current","passed");
    if(i<index) el.classList.add("passed");
    if(i===index) el.classList.add("current");
  });
}

// ===== 区間 =====
function updateSection(){
  let nextIndex=index+1;
  if(loop && index===stations.length-1) nextIndex=0;

  if(!loop && index===stations.length-1){
    sectionText.textContent="終点";
  }else{
    sectionText.textContent=
      `${stations[index].name}〜${stations[nextIndex].name}`;
  }
}

// ===== 運行 =====
function runTrain(){
  if(!running) return;

  updateStations();
  updateSection();

  let s=stations[index].stop;

  interval=setInterval(()=>{
    statusText.textContent="現在";
    topText.textContent=`まもなく ${stations[index].name}`;
    bottomText.textContent=`停車中 ${s}秒`;

    s--;

    if(s<0){
      clearInterval(interval);

      let t=stations[index].travel;

      interval=setInterval(()=>{
        statusText.textContent="まもなく";

        let nextIndex=index+1;
        if(loop && index===stations.length-1) nextIndex=0;

        let next=stations[nextIndex];

        topText.textContent=`次は ${next.name}`;
        bottomText.textContent=`${next.name}まで ${t}秒`;

        t--;

        if(t<0){
          clearInterval(interval);

          if(index<stations.length-1){
            index++;
          }else if(loop){
            index=0;
          }

          runTrain();
        }

      },1000);
    }

  },1000);
}

// ===== 操作 =====
function startTrain(){
  clearInterval(interval);
  index=0;
  running=true;
  runTrain();
}

function stopTrain(){
  running=false;
  clearInterval(interval);
}

function toggleLoop(){
  loop=!loop;
  render();
}

// ===== お知らせ =====
function setNotice(){
  noticeText.textContent =
    document.getElementById("noticeInput").value;
}

// 初期
render();
</script>

</body>
</html>
