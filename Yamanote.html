<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube モーダル再生</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}

h1 {
  text-align: center;
  padding: 20px;
}

.search {
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 65%;
  max-width: 500px;
  padding: 12px;
  border-radius: 20px;
  border: none;
  font-size: 16px;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 20px;
  background: red;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.movie_list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
}

.movie_item {
  background: #222;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
}

.movie_item:hover {
  background: #333;
}

.movie_img img {
  width: 100%;
  display: block;
}

.title {
  padding: 12px;
  font-weight: bold;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  margin: 0 12px 12px;
  padding: 4px 8px;
  background: red;
  border-radius: 10px;
  font-size: 12px;
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,0.85);
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal_content {
  width: 90%;
  max-width: 900px;
  position: relative;
}

.modal_content iframe {
  width: 100%;
  height: 500px;
  border: none;
  border-radius: 12px;
  background: black;
}

.close {
  position: absolute;
  top: -45px;
  right: 0;
  font-size: 36px;
  cursor: pointer;
}

@media (max-width: 700px) {
  .modal_content iframe {
    height: 250px;
  }

  input {
    width: 85%;
    margin-bottom: 8px;
  }
}
</style>
</head>

<body>

<h1>YouTube検索プレイヤー</h1>

<div class="search">
  <input id="searchInput" placeholder="動画・ショートを検索">
  <button onclick="searchVideos()">検索</button>
</div>

<ul id="movieList" class="movie_list"></ul>

<div id="modal" class="modal" onclick="closeModal(event)">
  <div class="modal_content">
    <span class="close" onclick="closePlayer()">×</span>
    <div id="playerArea"></div>
  </div>
</div>

<script>
const API_KEY = "AIzaSyBf5AkiXVgmQQwiP9HlfG3MzvUgIlR2vYI";

window.onload = () => {
  fetchVideos("人気 動画 shorts 音楽 ゲーム");
};

async function searchVideos() {
  const query = document.getElementById("searchInput").value.trim();

  if (!query) {
    alert("検索ワードを入力してね");
    return;
  }

  fetchVideos(query + " shorts");
}

async function fetchVideos(query) {
  const movieList = document.getElementById("movieList");
  movieList.innerHTML = "<p>読み込み中...</p>";

  const url =
    "https://www.googleapis.com/youtube/v3/search" +
    "?part=snippet" +
    "&type=video" +
    "&videoEmbeddable=true" +
    "&safeSearch=moderate" +
    "&maxResults=24" +
    "&q=" + encodeURIComponent(query) +
    "&key=" + API_KEY;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.error) {
      movieList.innerHTML = "<p>APIエラー：" + data.error.message + "</p>";
      return;
    }

    movieList.innerHTML = "";

    data.items.forEach(item => {
      const videoId = item.id.videoId;
      const title = item.snippet.title;
      const thumb =
        item.snippet.thumbnails.high?.url ||
        item.snippet.thumbnails.medium?.url ||
        item.snippet.thumbnails.default.url;

      const isShort =
        title.toLowerCase().includes("shorts") ||
        title.includes("ショート") ||
        title.includes("#shorts");

      const li = document.createElement("li");
      li.className = "movie_item";

      li.innerHTML = `
        <figure class="movie_img">
          <img src="${thumb}" alt="${title}">
        </figure>
        <p class="title">${title}</p>
        ${isShort ? '<span class="badge">Shorts</span>' : ''}
      `;

      li.onclick = () => openPlayer(videoId);

      movieList.appendChild(li);
    });

  } catch (e) {
    movieList.innerHTML = "<p>読み込み失敗</p>";
    console.error(e);
  }
}

function openPlayer(videoId) {
  const modal = document.getElementById("modal");
  const playerArea = document.getElementById("playerArea");

  playerArea.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${videoId}?rel=0&autoplay=1&playsinline=1"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  `;

  modal.classList.add("active");
}

function closePlayer() {
  document.getElementById("modal").classList.remove("active");
  document.getElementById("playerArea").innerHTML = "";
}

function closeModal(event) {
  if (event.target.id === "modal") {
    closePlayer();
  }
}

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") searchVideos();
});
</script>

</body>
</html>
